name: Release

# Publica uma versão: atualize "version" no package.json (npm version x.y.z), depois
#   git push origin main --follow-tags
# A tag vX.Y.Z dispara este workflow, que cria a Release e anexa os instaladores de Windows e Linux.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existente para (re)publicar, ex.: v0.1.6'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    name: Criar release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Conferir versão do package.json
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::A tag $TAG não bate com a versão $VERSION do package.json"
            exit 1
          fi

      - name: Criar release (se ainda não existir)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "DevOps Desktop $TAG" \
            --notes "Instaladores para Windows (.exe) e Linux (.AppImage e .deb). Veja como instalar e configurar o PAT no [README](https://github.com/${{ github.repository }}#readme)."

  build:
    name: Build ${{ matrix.name }}
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            target: --win
          - os: ubuntu-latest
            name: Linux
            target: --linux
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Empacotar e anexar à release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sem certificado de assinatura de código: não tentar assinar
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-vite build && npx electron-builder ${{ matrix.target }} --publish always
